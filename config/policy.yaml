# Decision-layer policy (hot-reloaded on mtime change). Bump `version` on every change and
# review with `python -m app.tools.replay --policy config/policy.next.yaml --since 14d` first.
version: 2026-11-10.1

thresholds:
  clarify_below: 0.7      # intent confidence < this -> route=clarify on a local model (no tier bump)
  ambiguous: 0.7          # router `ambiguous` (unclear referent) above this -> route=clarify (same handling)
  heavy: 0.6              # code_multi / long_ctx above this -> cloud_strong
  risky: 0.5              # router risky above this -> risky=True
  task_confirm_below: 0.7 # top task_type probability < this ...
  task_margin: 0.3        # ... or top-2 gap < this -> ask the owner which kind of answer (clarify.confirm_task_types)
  correction: 0.35        # router `correction` above this -> re-route previous + current message as one request (0.6 until 2026-11-09)

# Phase 11: morning brief (app/brief.py). Built in code, no model call. The full brief (calendar, due todos, weather,
# Inbox counts, spend) goes to the private web thread `web:brief` + an Inbox item; LINE only gets weather and counts.
brief:
  line: true
  spend: true
  sections: [calendar]
  weather:   # Open-Meteo (no key)
    - {name: 新北市中和區, lat: 24.999, lon: 121.499}
    - {name: 台北市中正區, lat: 25.032, lon: 121.519}

# Phase 11 schedules (app/schedules.py, Asia/Taipei cron). Builtins are inserted once; edit/disable them via
# /api/agent/schedules. Owner-made schedules (kind `prompt`) run their text as a cron job in `web:sched-<name>`.
schedules:
  builtin:
    morning_brief: {kind: brief, cron: "0 7 * * *"}
    nightly_eval: {kind: eval, cron: "30 2 * * *"}
    vault_daily: {kind: vault_daily, cron: "50 23 * * *"}   # §10a AI/Daily/<date>.md summary (no model call)

# Phase 11 events: POST /events/<source> with `X-Hub-Signature-256: sha256=<hmac>` (secret in EVENT_SECRETS JSON).
# An event only becomes an Inbox item (+ optional LINE line); it never starts an agent run.
events:
  sources: {}
  #  github: {title_field: repository.full_name, private: false, line: true, priority: normal}

# Nightly eval (app/tools/answer_eval.py): LINE alert when results drop vs. the previous run.
eval:
  max_answer_drop: 2      # answer passes down by this many or more
  max_recall_drop: 0.05   # KB recall@5 down by more than this
  case_timeout_s: 240

# L9 verify (§12, phase 10b): check each finished answer; a failed one is re-run local → cloud_fast → cloud_strong
# (never for PRIVATE or under the cloud kill switch, never after a write tool ran), then reported in the Inbox.
verify:
  enabled: false              # 2026-11-09 off for speed (owner will re-enable)
  min_score: 0.3              # Jev/Qwen "fully and correctly answers"; calibrated on 77 real turns (bad ones ≤0.2)
  max_escalations: 2
  require_citations: false    # true: verdict "uncited" fails. Off: a bigger model reruns the same retrieval, so it
                              # fails again (live: local → cloud_fast → cloud_strong all uncited, correct answer)
  simplified_min_chars: 3     # distinct Simplified-only characters that fail a non-shopping answer
  skip_task_types: [chitchat]
  trivial_chars: 300          # ...when the answer is shorter than this
  jev_timeout_s: 5
  qwen_timeout_s: 30
  inbox: true
  warning_zh: "⚠️ 這個回答沒有通過自動檢查,可能不完整或不正確,請自行確認。"
  warning_en: "⚠️ This answer failed the automatic check and may be incomplete or wrong; please double-check."

# Routes switched off: the decision layer sends them to chat (rule 1a, also /code). 2026-11-10: only chat until
# the clarify rules are tuned (owner will re-enable).
routes:
  disabled: [assistant, coding]

clarify:
  max_rounds: 10          # after this many clarify turns in a row, answer with stated assumptions
  context_ttl_s: 86400    # how long the next message counts as the answer to a clarifying question
  previous_ttl_s: 3600    # the previous message is sent to the router as context for this long
  confirm_task_types: [shopping]  # only ask "which kind of answer?" when one of the top-2 types is in here

# Per-turn caps on tool calls (one user turn, across clarify resumes).
tool_limits:
  web_search: 3   # 2026-11-10 back on: Jev needs_web gate, parallel search/fetch
  fetch_page: 4

# Grounded answering (§12a): clarify → verify claims → cite. enabled=false falls back to the ReAct graph.
grounding:
  enabled: true
  # cite_only (default): clarify -> search -> read cite_pages pages -> answer with [n] citations; no per-claim
  #   checks or "Unverified" list. verify: full §12a claim verification (slower, noisier on the 9B model).
  mode: cite_only
  citations: false                  # 2026-11-09 off: sources are background only, no [n] / sources list (was true)
  # Brave locale (both search tools): country=TW always; search_lang only for queries containing Chinese. 2026-11-03.
  search_country: TW
  search_lang_cjk: zh-hant
  # cite_only: search the web on every non-private turn (the model no longer decides needs_web), except
  # search_skip_task_types and turns the owner's documents already answer (rag.skip_clarify_score). 2026-11-03.
  always_search: true
  search_skip_task_types: [chitchat]
  # ...and turns the router scores below this on needs_web (Jev: lookups 0.64-0.97, common knowledge 0.07-0.24).
  # 2026-11-10 owner: 0.2.
  web_threshold: 0.2
  search_history_turns: 3           # cite_only plan_search sees this many earlier turns (follow-ups like "那價格呢?")
  cite_pages: 2                     # pages read per turn (also capped by tool_limits.fetch_page)
  cite_chars: 4000                  # excerpt chars per page given to the model
  # Models in this list read the best snippet_pages search snippets (title + description) instead of fetching
  # pages. 2026-11-10 bench (6 web questions): cloud_fast as good with snippets as with full text (−4-5k input
  # tokens; time about the same), local Qwen got 2/6 details wrong from snippets -> local keeps full text.
  # Owner: cloud chat on snippets; revisit when a research mode exists.
  snippet_models: [cloud_fast, cloud_strong]
  snippet_pages: 6
  per_turn: { max_usd: 0.05, max_active_s: 90 }
  reserve_for_compose: { usd_fraction: 0.2, seconds: 15 }
  brave_usd_per_query: 0.0          # VERIFY plan price
  llm_authority_cache_days: 30
  max_claims: 8                     # factual claims checked per turn; the rest are labelled unverified
  pending_ttl_s: 86400              # an unanswered clarifying question expires after this
  # Qwen3.x thinking on local (GPU) for the listed steps only; others run with think=false. Thinking eats
  # max_tokens, so these calls get local_think_tokens extra. Never on local_cpu. Measured 2026-10-28 with
  # [verify_support, compose] on qwen3.5:9b: ~140 s/turn, blows max_active_s, empty answers. 2026-10-29 bench
  # (compose only, 11 prompts): 6.3 -> 7.1/10 judged quality, 7 -> 22 s, up to ~4.6k thinking tokens.
  local_think_tasks: []            # 2026-11-09 off for speed (was [compose])
  local_think_tokens: 4096
  # Cloud models that reason before answering count reasoning in max_tokens; with a small cap (compose 400,
  # classify_source 120) the reasoning can use it all and leave an empty reply (finish_reason=length; seen
  # 2026-11-10 on cloud_fast compose, 1 of 6 runs). These models get this many extra tokens; an empty capped
  # reply is still retried once with double room. Not cloud_strong (Claude, no thinking unless asked).
  reasoning_tokens: { cloud_fast: 2048 }

# §12c shopping: requests to choose/buy a product (推薦/想買/預算/… hints, or a follow-up within session_ttl_s)
# fill slots (item, budget, use, specs, must-haves, brand, store), ask what is unknown one question per round
# (item, budget first; ≤ max_clarify_rounds; Skip searches now), search real store listings, recommend `picks` of them with name/price/store/link
# rendered by code. Standing preferences the owner states are kept in Redis `shop:prefs`.
shopping:
  enabled: false             # 2026-11-10 off until clarify rules are tuned (owner will re-enable)
  stores: [pchome, momo, yahoo]     # tools/shop.py adapters; Shopee blocks automated clients
  max_clarify_rounds: 10           # one question per round: item, budget, use, 1-2 specs, must-have, brand, store
  max_candidates: 15                # listings shown to the model
  min_relevance: 0.5                # share of a search term's character bigrams a listing name must contain
  picks: [3, 5]
  per_store: 20
  cache_s: 3600
  session_ttl_s: 1800               # follow-ups ("cheaper", "other brand") refine the last search

# §12b read-only rendering: the `browser` service (headless Chromium) re-reads pages whose plain fetch is a
# JS shell (< min_text_chars of HTML text) or returned a status in render_on_status. Used by fetch_source and
# fetch_page; the rendered text replaces the plain one only if longer. No clicks/forms/logins (phase 8b).
browser:
  enabled: true
  min_text_chars: 500
  render_on_status: [403]
  timeout_s: 20                     # page load (domcontentloaded)
  settle_ms: 1500                   # then wait up to this long for network idle

# Daily USD budget per provider (LiteLLM spend tracked by the harness).
budgets_usd_daily:
  openai: 5.0
  anthropic: 5.0
providers:                # model alias -> provider (for budget accounting)
  cloud_fast: openai
  cloud_strong: anthropic
background_budget_fraction: 0.5   # background jobs avoid cloud_strong above this spend fraction
alert_budget_fraction: 0.8        # LINE alert at this fraction; killswitch=cloud at 1.0

# USD per 1M tokens, used to estimate spend from usage metadata. Fill in to match litellm.yaml models.
prices_usd_per_mtok:
  local: { input: 0, output: 0 }
  local_cpu: { input: 0, output: 0 }
  cloud_fast: { input: 0.10, output: 0.50 }
  cloud_strong: { input: 3.0, output: 15.0 }

router:
  jev_timeout_s: 2.0
  qwen_timeout_s: 20.0
  cloud_router_timeout_s: 10.0
  rule_confidence: 0.6

executor:
  recursion_limit: 90            # 10 clarify rounds x3 + 3 research loops x5 + fixed nodes ~= 55
  assistant_history_turns: 20    # assistant route: earlier tool calls are hidden (Qwen copies them); was 8 until 2026-11-06
  max_history_turns: 20          # safety cap on verbatim user turns in the model context (see history:)
  line_max_chars: 4500
  line_reply_token_ttl_s: 50     # VERIFY current LINE reply-token expiry
  line_deadline_s: 35            # §19: a LINE turn not done by then stops and replies line_too_late_text (all models)
  line_too_late_text: "⌛ 來不及在 LINE 回覆時限內答完,請稍後再問,或到網頁問。"
  private_line_notice: "🔒 The answer contains private data. Open the web app to read it."

# Concise mode (2026-11-09, for speed: output tokens are ~80% of local answer time, ~16 ms/token): grounded compose
# and ReAct answers get a brevity rule (≤ max_sentences, or one short question about the owner's intent when unclear);
# grounded compose is capped at max_tokens (was 1500). Shopping and coding are unchanged. concise: false = old style.
answer_style:
  concise: true
  max_sentences: 3
  max_tokens: 400

# Rolling compaction (app/history.py, 2026-11-09): older turns are folded into one running summary per thread
# (local model, background queue, after the reply); the model sees summary + the turns after it verbatim.
# Summary keeps constraints/preferences, completed actions, question → conclusion, sources, corrections, open items;
# drops tool output, page excerpts, thinking, small talk. Local context is 32768 tokens (OLLAMA_CONTEXT_LENGTH).
history:
  enabled: true
  keep_turns: 6            # most recent owner turns always kept verbatim
  compact_every: 10        # fold when this many turns beyond keep_turns are not yet summarised
  max_tokens: 12000        # ...or sooner when the verbatim history is estimated above this (~1/3 of the context)
  topic_keep_turns: 2      # task type changed (topic_ignore_types ignored): fold all but this many
  topic_ignore_types: [chitchat]
  summary_max_chars: 3000
  pin_min_chars: 1500      # an older owner message this long (paste / attachment) stays verbatim; latest one only
  pin_max_chars: 4000
  model: local             # PRIVATE threads always use local

queues:
  interactive: { name: "arq:interactive", timeout_s: 300 }
  background: { name: "arq:background", timeout_s: 3600 }   # coding: Copilot + tests + 1 retry
  coding: { name: "arq:background", timeout_s: 3600 }       # phase 5 coding graph (§9a); same worker as background
  media: { name: "arq:media", timeout_s: 3600 }           # phase 9 media-worker (§5): extraction only
  ingest: { name: "arq:background", timeout_s: 1800 }       # phase 6 Copilot session ingest (§9b)

heavy_media_kinds: [video, large_doc]

# Phase 9 (§5 L2): attachments → text in the media-worker, then the normal pipeline (as <untrusted> data).
media:
  max_mb: { web: 50, line: 100 }      # LINE's own cap is 300 MB for files; videos are shorter in practice
  max_chars: 8000                     # attachment text in the model prompt (split over the files; rest truncated)
  router_chars: 1200                  # cap for a voice note used as the message (router sees no file content)
  voice_as_message_s: 120             # a voice note this short (or any LINE voice) with no typed text IS the request
  line_text_wait_s: 15                # LINE sends photo and question separately: a file-only run waits this long for a text
  line_follow_s: 60                   # a text within this time of a LINE file is about it (later: re-attached, cached)
  max_jobs: 2
  vision_model: qwen3.5:9b            # Ollama; vision verified (§17)
  default_prompts:                    # when only a file is sent
    image: 請說明這張圖片的內容。
    video: 請摘要這段影片的內容。
    doc: 請摘要這份文件。
    large_doc: 請摘要這份文件的重點。
    voice: 請整理這段錄音的重點。
    mixed: 請說明這些附件的內容。
  asr:
    model: large-v3-turbo             # faster-whisper; CUDA fp16 in every GPU state, CPU int8 if CUDA fails
    cpu_threads: 8
    beam_size: 5
    initial_prompt: 以下是繁體中文的句子。
    keep_alive_s: 300                 # unload after this idle time (also while GAMING: only Qwen is unloaded)
  image:
    max_side: 1280                    # downscale before the vision model (EXIF always stripped)
    when_gpu_busy: ocr_only           # ocr_only | cloud (NORMAL files only, kill switch off, budget left)
    cloud_model: cloud_fast
    send_to_cloud: true               # cloud answer tiers also see the turn's photos (NORMAL only, EXIF stripped)
    cloud_max_side: 2048
    max_images: 4
  video:
    max_frames: 16
    scene: 0.3                        # ffmpeg scene-change threshold for keyframes
    max_s: 10800
  doc:
    large_pages: 20                   # more pages (or large_chars) → large_doc: background + knowledge base
    large_chars: 40000
    docling_max_pages: 50             # longer PDFs use plain page text (fast)
    scanned_chars_per_page: 30        # below this a PDF counts as scanned → RapidOCR
    ocr_max_pages: 30
defer_recheck_s: 300
gpu_concurrency: 2

# gpu-governor (§11): publishes Redis gpu_state FREE|BUSY|GAMING.
gpu_governor:                # phase 4 (§11): app/governor.py, compose service gpu-governor
  enabled: true              # false = no heartbeat alert (gpu_state then only changes via host/gpu-state.sh)
  poll_s: 2
  gaming_container: steam-headless
  gaming_util: 30          # GPU util % (with steam-headless running) that counts as gaming; NVENC > 0 always does
  gaming_exit_s: 300       # stay GAMING this long after the condition clears
  busy_util: 70            # GPU util % sustained for busy_enter_s -> BUSY (ignored while harness jobs hold the GPU)
  busy_enter_s: 30
  busy_free_vram_gb: 8     # free VRAM (not counting Ollama's own models) below this for busy_enter_s -> BUSY
  busy_exit_s: 120
  inflight_short_s: 20     # a local run older than this when GAMING starts is moved off the GPU (cloud / deferred)
  heartbeat_ttl_s: 30      # no governor heartbeat for this long -> LINE alert
  # Ollama models left in VRAM on GAMING (only the chat models are unloaded; 2026-11-09). Embeddings listed here
  # also keep running on the GPU while GAMING (app/rag/embed.py). The reranker service is not Ollama: it stays on
  # the GPU (~1.2 GB) regardless.
  keep_on_gaming: [qwen3-embedding:0.6b]

alerts:
  dedupe_s: 3600
  queue_age_s: 300
  quiet_prefixes: ["queue:", "line:"]   # logged only, listed in the next morning brief (no LINE push / Inbox item)

rag:                         # phase 10 (§10): app/rag/, docs folder DOCS_DIR -> /docs, reranker service
  enabled: true
  embed_model: qwen3-embedding:0.6b   # 1024-dim; changing it needs a re-index (DROP TABLE chunks)
  embed_ctx: 2048
  embed_batch: 16
  embed_keep_alive: -1       # resident (2026-11-10); stays on the GPU while GAMING too (gpu_governor.keep_on_gaming)
  extensions: [.md, .markdown, .txt]
  max_file_kb: 2048
  index_interval_min: 5      # scheduler cron re-scans the docs folder (unchanged files are skipped by hash)
  chunk_min_tokens: 400
  chunk_max_tokens: 800
  chunk_overlap: 0.15
  candidates: 50             # vector top-N and keyword top-N, fused by RRF
  rrf_k: 60
  rerank: true               # CPU cross-encoder (bge-reranker-v2-m3); RRF order if it is down
  rerank_candidates: 10      # ~4.4 s/query on CPU (20 → ~8 s, no recall gain on the eval set)
  rerank_timeout_s: 15
  # A hit is kept if rerank score >= min_rerank_score OR vector sim >= min_vector_sim (reranker off: vector only).
  # Measured: off-topic queries score <= 0.004 / sim <= 0.25; a 0.05+ rerank floor alone drops correct hits.
  min_rerank_score: 0.01
  min_vector_sim: 0.45
  top_k: 5
  skip_clarify_score: 0.5   # a KB hit this sure → no clarifying question (cite_only); weaker hits are hinted
  skip_task_types: [chitchat]  # grounded graph does not search the KB for these
  link_seeds: 3              # §10a: the best fused candidates whose vault notes are expanded one link away
  link_candidates: 3         # chunks of linked notes (closest to the query) added to the rerank pool; 0 = off

vault:                       # phase 10a (§10a): Obsidian vault VAULT_DIR -> /vault (ro), Inbox/ + AI/ rw, Syncthing
  enabled: true
  debounce_ms: 2000          # vault-indexer: quiet time after a change before re-indexing (Syncthing writes in bursts)
  index_lock_s: 1800
  attachments: true          # embedded PDF/images/Office files: extracted by the media-worker (always PRIVATE → local)
  attachment_kinds: [doc, image]
  attachment_max_mb: 50
  attachment_max_chars: 100000
  daily_folder: AI/Daily     # nightly summary + `## Log` (append_daily_note); always privacy: private
  notify_line: true          # LINE push when a note edit waits for approval (no note content)
  exclude_paths: [Notion]    # folders kept in the vault but never indexed/linked/searched/read by agents (raw import)

memory:                      # phase 10 (§10): app/memory.py, LangGraph PostgresStore
  enabled: true
  auto_extract: true         # local model extracts profile/procedure facts after each turn (background queue)
  min_chars: 6
  max_ops_per_turn: 5
  recall_k: 6
  min_score: 0.5             # cosine similarity floor for recall into prompts
  extract_context_min_score: 0.3
  episode_idle_s: 1800       # a thread idle this long with new turns gets an episode summary
  episode_ttl_days: 180      # episodes expire unless pinned

copilot_ingest:              # phase 6 (§9b/§9c): app/copilot_ingest.py, app/jobs/copilot_jobs.py, app/mcp_server.py
  enabled: true
  debounce_s: 60             # agentStop hooks within this window share one ingest job (it reads the whole file)
  reconcile_idle_s: 1800     # nightly reconciler: sessions idle this long with no recorded sessionEnd are ingested
  reconcile_days: 3          # ...but only sessions modified within this many days
  min_turns: 1               # sessions with fewer owner prompts are skipped
  extract_facts: true        # on session end, run the profile/procedure extractor over the owner's prompts
  mcp_recall_k: 6

inbox:                       # phase 7 (§12 L10): app/inbox.py; todos need no config (app/todos.py)
  enabled: true
  memory_items: true         # every automatic/agent memory write appears as a low-priority item
  keep_done_days: 30         # answered/dismissed items are deleted after this
  keep_low_days: 14          # unread low-priority items (memory writes) are deleted after this

calendar:                    # phase 7b: app/gcal.py + tools/calendar.py; needs host/google_auth.py to have run
  enabled: true              # writes are Inbox proposals; the grant is calendar.events only

todos:                       # phase 7: reminders for todos with a due date (jobs/todo_jobs.py)
  reminders:
    enabled: true
    before_s: 3600           # first reminder this long before due_at
    overdue_s: 3600          # second reminder this long after due_at if still open
    quiet:                   # no reminders in this window; they go out right after it ends
      start_hour: 0
      end_hour: 7            # local (Asia/Taipei) hours [0, 7)
      weekdays_only: true    # Mon-Fri; weekends have no quiet window
