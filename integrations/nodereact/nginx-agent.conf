# nodeReact nginx additions (server block for the public site).
# nginx-proxy-release is on the `anomopi_default` network, which agent-api also joins (as alias `agent-api`).

# Hide ?token= (EventSource auth) from access logs.
map $request_uri $agent_loggable_uri {
    ~^(?<p>[^?]*)\?(.*&)?token=[^&]*(.*)$  "$p?<token-stripped>";
    default                                 $request_uri;
}
# (use $agent_loggable_uri in a custom log_format for the locations below)

location /api/agent/ {
    resolver 127.0.0.11 valid=30s;
    set $agent_upstream http://agent-api:8000;
    proxy_pass $agent_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # SSE
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
}

location = /line/webhook {
    resolver 127.0.0.11 valid=30s;
    set $agent_upstream http://agent-api:8000;
    proxy_pass $agent_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
